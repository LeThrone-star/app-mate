<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafici · Astral</title>
  <meta name="description" content="Calcolatrice grafica: disegna funzioni, curve, disequazioni e usa gli slider.">
  <link rel="canonical" href="https://lethrone-star.github.io/app-mate/grafici.html">

  <meta property="og:site_name" content="Astral">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Grafici · Astral">
  <meta property="og:description" content="Calcolatrice grafica: disegna funzioni, curve, disequazioni e usa gli slider.">
  <meta property="og:url" content="https://lethrone-star.github.io/app-mate/grafici.html">
  <meta name="theme-color" content="#2463eb">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Astral">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .grapher { flex: 1; display: grid; grid-template-columns: 410px minmax(0, 1fr); min-height: 0; }
    .panel { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); min-height: 0; }
    .panel-bar { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: nowrap; }
    .panel-bar .btn { flex: none; white-space: nowrap; }
    .panel-bar select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); flex: 1 1 auto; min-width: 0; width: auto; height: 32px; font-size: .85rem; }
    #expr-list { flex: 1; overflow-y: auto; }
    .expr-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 30px; border-bottom: 1px solid var(--border); min-height: 56px; position: relative; }
    .expr-row.focused { box-shadow: inset 3px 0 0 var(--math); background: color-mix(in srgb, var(--math-soft) 40%, var(--surface)); }
    .expr-gutter { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; background: var(--surface-2); }
    .expr-index { font-size: .7rem; color: var(--muted); }
    .expr-swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); background: var(--c); cursor: pointer; padding: 0; }
    .expr-swatch.off { background: transparent; }
    .expr-swatch.none { visibility: hidden; }
    .expr-main { padding: 8px 6px 8px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .expr-input { width: 100%; border: 0; background: transparent; font-family: var(--mono); font-size: 1rem; padding: 6px 0; outline: none; }
    .expr-tex { display: none; padding: 4px 0; font-size: 1.1rem; cursor: text; overflow-x: auto; overflow-y: hidden; }
    .expr-row.show-tex .expr-tex { display: block; }
    .expr-row.show-tex .expr-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; }
    .expr-info { font-size: .82rem; margin-top: 2px; }
    .expr-info .err { color: var(--bad); }
    .expr-info .val { color: var(--muted); font-family: var(--mono); font-weight: 600; }
    .expr-info .mk { color: var(--muted); }
    .chip { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 1px 10px; cursor: pointer; font-family: var(--mono); font-size: .82rem; }
    .chip:hover { border-color: var(--math); color: var(--math); }
    .expr-slider { display: grid; grid-template-columns: 28px 44px 1fr 44px; gap: 6px; align-items: center; margin-top: 4px; }
    .expr-slider .lim { width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); font-size: .75rem; padding: 2px 4px; text-align: center; font-family: var(--mono); }
    .expr-slider .play { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: .7rem; padding: 0; }
    .expr-slider .play.on { background: var(--math); color: #fff; border-color: var(--math); }
    .expr-del { border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; cursor: pointer; opacity: 0; }
    .expr-row:hover .expr-del, .expr-row.focused .expr-del { opacity: 1; }
    .expr-del:hover { color: var(--bad); }
    .keypad { border-top: 1px solid var(--border); background: var(--surface-2); padding: 8px max(8px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)); flex: none; }
    .kp-inner { display: flex; gap: 14px; max-width: 1100px; margin: 0 auto; }
    .kp-sec { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
    .kp-left { flex: 4; }
    .kp-mid { flex: 4; }
    .kp-right { flex: 2; }
    .kp-fn .kp-left { flex: 8; }
    .kp-abc .kp-left { flex: 10; }
    .kp-key { height: 42px; border-radius: 9px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 1rem; font-family: "KaTeX_Main", "Times New Roman", serif; padding: 0 2px; min-width: 0; overflow: hidden; white-space: nowrap; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .kp-key:hover { border-color: var(--math); }
    .kp-key:active { transform: translateY(1px); background: var(--surface-3); }
    .kp-key:focus-visible { outline: 2px solid var(--math); outline-offset: 1px; }
    .kp-key sup, .kp-key sub { font-size: .7em; }
    .kp-key.num { background: var(--surface); font-family: var(--font); font-weight: 600; font-size: 1.1rem; }
    .kp-key.op { color: var(--math); font-family: var(--font); font-weight: 700; font-size: 1.15rem; }
    .kp-key.act { background: var(--surface-3); font-family: var(--font); font-weight: 600; font-size: .92rem; }
    .kp-key.enter { background: var(--math); border-color: var(--math); color: #fff; font-size: 1.2rem; }
    .kp-key.let { font-family: var(--font); }
    .kp-fn .kp-key { font-size: .9rem; }
    .kp-key.span2 { grid-column: span 2; }
    .kp-fab { position: absolute; left: 12px; bottom: 12px; width: 44px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font-size: 1.2rem; }
    body.kp-open .kp-fab { background: var(--math); color: #fff; border-color: var(--math); }
    body.kp-open .help { display: none; }
    .help { padding: 10px 12px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--border); }
    .help code { color: var(--text); }
    .stage { position: relative; min-width: 0; min-height: 0; }
    #graph { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
    .zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font-size: 1.1rem; }
    @media (max-width: 820px) {
      body { overflow: auto; height: auto; }
      .grapher { grid-template-columns: minmax(0, 1fr); grid-template-rows: 45vh auto; }
      .keypad { position: sticky; bottom: 0; z-index: 20; padding-inline: 6px; }
      .kp-inner { gap: 6px; }
      .kp-sec { gap: 4px; }
      .kp-key { height: 40px; font-size: .95rem; }
      .kp-fn .kp-key, .kp-abc .kp-key { font-size: .8rem; }
      .kp-key.act { font-size: .78rem; }
    }
    @media (max-width: 480px) {
      .panel-bar .lbl { display: none; }
      #add-expr { font-size: 1.1rem; padding-inline: 12px; }
      .stage { order: -1; border-bottom: 1px solid var(--border); }
      .panel { border-right: 0; }
      #expr-list { max-height: none; }
      .expr-del { opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="site-header"></header>
  <main class="grapher">
    <section class="panel" aria-label="Espressioni">
      <div class="panel-bar">
        <button class="btn small primary" id="add-expr" title="Nuova espressione" aria-label="Aggiungi espressione">＋<span class="lbl"> Aggiungi</span></button>
        <select id="examples" aria-label="Esempi"><option value="">Esempi…</option></select>
        <button class="btn small" id="share">Condividi</button>
        <button class="btn small" id="toggle-keypad" title="Tastiera">⌨</button>
        <button class="btn small" id="clear-all" title="Cancella tutto">🗑</button>
      </div>
      <div id="expr-list"></div>
      <div class="help">
        Prova: <code>y = x^2 - 3</code>, <code>f(x) = sin(2x)</code>, <code>f'(x)</code>,
        <code>x^2 + y^2 = 16</code>, <code>y &lt; 2x + 1</code>, <code>(2, 3)</code>, <code>a = 3</code> (slider).
        Trascina per spostarti, rotellina o pizzico per lo zoom, clicca su una curva per leggere le coordinate.
        Seleziona un'espressione per vedere zeri, massimi e minimi.
      </div>
    </section>
    <section class="stage">
      <canvas id="graph" aria-label="Piano cartesiano"></canvas>
      <div class="zoom">
        <button id="zoom-in" title="Ingrandisci" aria-label="Ingrandisci">＋</button>
        <button id="zoom-out" title="Riduci" aria-label="Riduci">−</button>
        <button id="zoom-home" title="Vista iniziale" aria-label="Vista iniziale">⌂</button>
      </div>
      <button class="kp-fab" id="kp-fab" title="Mostra/nascondi la tastiera" aria-label="Tastiera">⌨</button>
    </section>
  </main>
  <div class="keypad hidden" id="kp" aria-label="Tastiera matematica"></div>
  <script src="assets/common.js"></script>
  <script src="assets/parser.js"></script>
  <script src="assets/plot.js"></script>
  <script src="assets/keypad.js"></script>
  <script src="assets/grapher.js"></script>
</body>
</html>
